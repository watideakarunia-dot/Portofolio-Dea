// membuat variabel
var name = "Detik.com";
var visitorCount = 3355;
var isActive = true;

//logic program
var nilai = prompt("Inputkan Nilai akhir:");
var grade= "";

// Mengubah input teks menjadi angka agar perbandingan akurat
nilai = Number(nilai); 

if (nilai >= 81) {
    grade = "A";
} else if (nilai >= 71) {
    grade = "B+";
} else if (nilai >= 66) {
    grade = "B";
} else if (nilai >= 61) {
    grade = "C+";
} else if (nilai >= 56) {
    grade = "C";
} else if (nilai >= 51) {
    grade = "D+";
} else if (nilai >= 46) {
    grade = "D";
} else {
    grade = "F";
}

// Perbaikan: Hapus tanda $ menjadi langsung 'grade'
document.write("Nilai anda adalah" + nilai);
document.write("Grade Anda adalah: " + grade);
